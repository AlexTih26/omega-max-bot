server {
    listen 80;
    listen [::]:80;
    server_name avtmsk.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name avtmsk.ru;

    root /MAX_BOT/web;
    index avtmsk-index.html;
    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/avtmsk.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avtmsk.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /api/taksimo/auth/check {
        internal;
        proxy_pass http://127.0.0.1:8765;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location = /api/taksimo/auth {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location /api/taksimo/ {
        auth_request /api/taksimo/auth/check;
        error_page 401 = @taksimo_login;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @taksimo_login {
        return 302 /taksimo-login.html?next=$request_uri;
    }

    location = /taksimo.html {
        auth_request /api/taksimo/auth/check;
        error_page 401 = @taksimo_login;
        try_files $uri =404;
    }

    location = /taksimo.js {
        auth_request /api/taksimo/auth/check;
        error_page 401 = @taksimo_login;
        try_files $uri =404;
    }

    location = /taksimo.css {
        auth_request /api/taksimo/auth/check;
        error_page 401 = @taksimo_login;
        try_files $uri =404;
    }

    location ~* \.(webp|png|jpg|jpeg|gif|ico|css|js|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = / {
        try_files /avtmsk-index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
