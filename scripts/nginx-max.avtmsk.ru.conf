server {
    listen 80;
    listen [::]:80;
    server_name max.avtmsk.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name max.avtmsk.ru;

    root /MAX_BOT/web;
    index index.html;
    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/max.avtmsk.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/max.avtmsk.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Max-Init-Data $http_x_max_init_data;
    }

    location ~* \.(webp|png|jpg|jpeg|gif|ico|css|js|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
