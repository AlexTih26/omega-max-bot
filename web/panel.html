<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f1419">
  <title>Панель — загрузка</title>
  <script src="https://st.max.ru/js/max-web-app.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #0f1419;
      color: #8b98a8;
      font: 500 15px/1.4 Inter, system-ui, sans-serif;
      padding: 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <p id="msg">Открываем панель…</p>
  <script>
    (function () {
      var webApp = window.WebApp || null;
      var msg = document.getElementById("msg");
      var attempt = 0;
      var maxAttempts = 5;
      var delays = [0, 280, 600, 1200, 2000];

      function readInitDataFromUrl() {
        var params = new URLSearchParams(window.location.search);
        var fromQuery =
          params.get("initData") ||
          params.get("InitData") ||
          params.get("tgWebAppData");
        if (fromQuery) return fromQuery;
        if (window.location.hash && window.location.hash.length > 1) {
          var hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
          return (
            hash.get("initData") ||
            hash.get("InitData") ||
            hash.get("tgWebAppData") ||
            ""
          );
        }
        return "";
      }

      function syncInitData() {
        if (webApp && webApp.initData) return webApp.initData;
        return readInitDataFromUrl();
      }

      function startParam() {
        var params = new URLSearchParams(window.location.search);
        var fromQuery = params.get("WebAppStartParam") || params.get("startapp") || "";
        if (fromQuery) return fromQuery;
        if (window.location.hash && window.location.hash.length > 1) {
          var hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
          return hash.get("WebAppStartParam") || hash.get("startapp") || "";
        }
        if (webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.start_param) {
          return webApp.initDataUnsafe.start_param;
        }
        return "";
      }

      function redirectTo(path) {
        var q = window.location.search || "";
        var h = window.location.hash || "";
        window.location.replace(path + q + h);
      }

      function failMessage(status, bodyError) {
        if (status === 401) {
          return "Откройте панель кнопкой из чата MAX (не из браузера). Закройте и откройте снова.";
        }
        if (status === 403) {
          return "Нет доступа к этой панели.";
        }
        if (bodyError) return bodyError;
        return "Не удалось открыть панель — попробуйте ещё раз.";
      }

      function fetchRole(initData) {
        var url = "/api/panel/role?initData=" + encodeURIComponent(initData);
        return fetch(url, {
          headers: { "X-Max-Init-Data": initData },
        }).then(function (r) {
          return r.json().then(function (body) {
            if (!r.ok) {
              var err = new Error(body.error || "role failed");
              err.status = r.status;
              throw err;
            }
            return body;
          });
        });
      }

      function boot() {
        if (webApp) {
          try {
            if (webApp.ready) webApp.ready();
            if (webApp.expand) webApp.expand();
          } catch (e) {}
        }

        var sp = startParam();
        if (sp === "admin" || sp === "adm") {
          redirectTo("/admin.html");
          return;
        }
        if (sp === "accountant" || sp === "acc" || sp === "rumex_accountant") {
          redirectTo("/rumex-accountant.html");
          return;
        }

        var initData = syncInitData();
        if (!initData) {
          if (attempt < maxAttempts - 1) {
            attempt += 1;
            setTimeout(boot, delays[attempt] || 2000);
            return;
          }
          msg.textContent = "Откройте панель кнопкой из чата MAX ↓";
          return;
        }

        fetchRole(initData)
          .then(function (data) {
            redirectTo(data.redirect || "/drivers.html");
          })
          .catch(function (err) {
            if (attempt < maxAttempts - 1 && (err.status === 401 || !err.status)) {
              attempt += 1;
              msg.textContent = "Подключаем…";
              setTimeout(boot, delays[attempt] || 2000);
              return;
            }
            msg.textContent = failMessage(err.status, err.message);
          });
      }

      setTimeout(boot, webApp && webApp.initData ? 0 : 120);
    })();
  </script>
</body>
</html>
