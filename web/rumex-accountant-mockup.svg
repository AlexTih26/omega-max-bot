<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1500" viewBox="0 0 1080 1500" role="img" aria-labelledby="title desc">
  <title id="title">Макет кабинета бухгалтера РУМЕКС</title>
  <desc id="desc">Схема интерфейса с вкладками Работа, Реестр, Карточки машин и Справочники, карточкой отгрузки и основными кнопками.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2631"/>
      <stop offset="1" stop-color="#17202b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <style>
      .bg { fill: url(#page); }
      .shell { fill: #242f3e; stroke: #405065; stroke-width: 1.5; filter: url(#shadow); }
      .panel { fill: #293545; stroke: #45566c; stroke-width: 1.2; }
      .panel-soft { fill: #233041; stroke: #3c4e64; stroke-width: 1.2; }
      .muted-panel { fill: #202b39; stroke: #3d4e62; stroke-width: 1.1; }
      .tab { fill: #202b39; stroke: #46576c; stroke-width: 1.2; }
      .tab-active { fill: #183e35; stroke: #70d5b5; stroke-width: 2.4; }
      .accent { fill: #70d5b5; }
      .text { fill: #f0f4fa; font-family: Inter, Arial, sans-serif; }
      .muted { fill: #b7c2d2; font-family: Inter, Arial, sans-serif; }
      .tiny { font-size: 20px; letter-spacing: 1.5px; font-weight: 700; }
      .h1 { font-size: 42px; font-weight: 800; }
      .h2 { font-size: 34px; font-weight: 800; }
      .h3 { font-size: 27px; font-weight: 800; }
      .body { font-size: 23px; }
      .small { font-size: 19px; }
      .tab-text { font-size: 22px; font-weight: 800; }
      .date { font-size: 22px; font-weight: 800; fill: #cbd5e1; }
      .number { font-size: 25px; font-weight: 900; fill: #f8fafc; }
      .badge-wait { fill: #493b21; stroke: #ffd37e; stroke-width: 1.2; }
      .badge-ready { fill: #1d4355; stroke: #a8e2fa; stroke-width: 1.2; }
      .badge-done { fill: #183e35; stroke: #70d5b5; stroke-width: 1.2; }
      .button-primary { fill: #70d5b5; }
      .button-warning { fill: #ffd37e; }
      .button-secondary { fill: transparent; stroke: #708197; stroke-width: 1.8; }
      .button-text-dark { fill: #10261f; font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 900; }
      .button-warning-text { fill: #33240b; font-family: Inter, Arial, sans-serif; font-size: 21px; font-weight: 900; }
      .button-light { fill: #dbeafe; font-family: Inter, Arial, sans-serif; font-size: 20px; font-weight: 800; }
      .callout { fill: #fff4d8; stroke: #ffd37e; stroke-width: 2; }
      .callout-text { fill: #493b21; font-family: Inter, Arial, sans-serif; font-size: 20px; font-weight: 800; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1080" height="1500"/>
  <rect class="shell" x="70" y="60" width="940" height="1380" rx="34"/>

  <!-- Header -->
  <text class="accent tiny" x="112" y="130">РУМЕКС · КАБИНЕТ БУХГАЛТЕРА</text>
  <text class="text h1" x="112" y="185">Работа с отгрузками</text>
  <text class="muted body" x="112" y="230">Проверка погрузок, ЭДО и документы</text>
  <text class="text body" x="835" y="132" text-anchor="end">Бухгалтер 1</text>
  <text class="accent small" x="835" y="170" text-anchor="end">Выйти</text>

  <!-- Tabs -->
  <g transform="translate(112 280)">
    <rect class="tab-active" x="0" y="0" width="130" height="58" rx="18"/>
    <text class="text tab-text" x="65" y="37" text-anchor="middle">Работа</text>
    <rect class="tab" x="154" y="0" width="125" height="58" rx="18"/>
    <text class="muted tab-text" x="216" y="37" text-anchor="middle">Реестр</text>
    <rect class="tab" x="303" y="0" width="245" height="58" rx="18"/>
    <text class="muted tab-text" x="425" y="37" text-anchor="middle">Карточки машин</text>
    <rect class="tab" x="572" y="0" width="205" height="58" rx="18"/>
    <text class="muted tab-text" x="674" y="37" text-anchor="middle">Справочники</text>
  </g>

  <!-- Work section -->
  <text class="accent tiny" x="112" y="400">ТЕКУЩИЕ ЗАДАЧИ</text>
  <text class="text h2" x="112" y="462">На проверке</text>
  <text class="muted body" x="112" y="510">Погрузки, где бухгалтер должен принять решение.</text>

  <!-- Card collapsed -->
  <rect class="panel" x="112" y="550" width="856" height="118" rx="24"/>
  <text class="date" x="142" y="600">14.09.2026, 01:30</text>
  <text class="number" x="370" y="600">ТТН №РМ-2026-000005</text>
  <text class="muted small" x="142" y="636">С294ЕЕ / 138 · SHACMAN · 3 поз.</text>
  <rect class="badge-wait" x="748" y="583" width="185" height="38" rx="19"/>
  <text class="muted small" x="840" y="609" text-anchor="middle">Ожидает проверки</text>

  <!-- Open card -->
  <rect class="panel-soft" x="112" y="710" width="856" height="530" rx="28"/>
  <text class="date" x="142" y="765">14.09.2026, 01:30</text>
  <text class="number" x="370" y="765">ТТН №РМ-2026-000005</text>
  <rect class="badge-wait" x="744" y="737" width="190" height="38" rx="19"/>
  <text class="muted small" x="839" y="763" text-anchor="middle">Ожидает проверки</text>

  <text class="accent tiny" x="142" y="825">СНИМОК ДОКУМЕНТА</text>
  <rect class="muted-panel" x="142" y="850" width="370" height="94" rx="18"/>
  <text class="text small" x="164" y="888">Машина: С294ЕЕ / 138</text>
  <text class="muted small" x="164" y="920">SHACMAN · водитель Иванов И.И.</text>

  <rect class="muted-panel" x="535" y="850" width="398" height="94" rx="18"/>
  <text class="text small" x="557" y="888">Перевозчик: ООО «Комсомольская ТК»</text>
  <text class="muted small" x="557" y="920">В/У 38 12 123456</text>

  <text class="accent tiny" x="142" y="990">ГРУЗ</text>
  <rect class="muted-panel" x="142" y="1015" width="791" height="112" rx="18"/>
  <text class="text small" x="164" y="1050">БЛОК 9,7/8,8 · A 3611</text>
  <text class="muted small" x="850" y="1050" text-anchor="end">7 780 кг</text>
  <text class="text small" x="164" y="1084">БЛОК 9,7/8,8 · K 7741</text>
  <text class="muted small" x="850" y="1084" text-anchor="end">3 850 кг</text>
  <text class="text small" x="164" y="1118">БЛОК 9,7/8,8 · A 3612</text>
  <text class="muted small" x="850" y="1118" text-anchor="end">7 780 кг</text>

  <text class="text body" x="142" y="1180">Основные действия бухгалтера</text>
  <rect class="button-primary" x="142" y="1205" width="385" height="62" rx="18"/>
  <text class="button-text-dark" x="334" y="1244" text-anchor="middle">Проверить и ожидать ЭДО</text>
  <rect class="button-warning" x="548" y="1205" width="385" height="62" rx="18"/>
  <text class="button-warning-text" x="740" y="1244" text-anchor="middle">Вернуть на исправление</text>

  <!-- Fleet / directory miniature -->
  <text class="accent tiny" x="112" y="1315">КАРТОЧКИ МАШИН · СПРАВОЧНИКИ</text>
  <rect class="panel" x="112" y="1342" width="400" height="70" rx="22"/>
  <text class="text small" x="142" y="1384">Обновить снимок машин</text>
  <rect class="button-primary" x="360" y="1356" width="120" height="42" rx="14"/>
  <text class="button-text-dark" x="420" y="1384" text-anchor="middle" font-size="18">Ярче?</text>

  <rect class="panel" x="535" y="1342" width="398" height="70" rx="22"/>
  <text class="text small" x="565" y="1384">Добавить перевозчика</text>
  <rect class="button-primary" x="782" y="1356" width="120" height="42" rx="14"/>
  <text class="button-text-dark" x="842" y="1384" text-anchor="middle" font-size="18">Ярче?</text>

  <!-- Callouts -->
  <rect class="callout" x="645" y="398" width="323" height="94" rx="20"/>
  <text class="callout-text" x="666" y="432">Что можно сделать ярче:</text>
  <text class="callout-text" x="666" y="462">основные кнопки, статусы,</text>
  <text class="callout-text" x="666" y="492">активную вкладку.</text>
</svg>
